<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Diary App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Diary App</h1>

    <!-- CREATE / UPDATE FORM -->
    <div class="card">
        <form id="diary-form">
            <input type="hidden" id="entry-id">
            
            <div class="form-group">
                <label for="entry-timestamp">Timestamp</label>
                <input type="datetime-local" id="entry-timestamp" required>
            </div>

            <div class="form-group">
                <label for="entry-content">Content</label>
                <textarea id="entry-content" placeholder="What's on your mind today?" required></textarea>
            </div>

            <div class="button-group">
                <button type="submit" id="submit-btn">Add Entry</button>
                <button type="button" id="cancel-btn" class="secondary" style="display: none;" onclick="resetForm()">Cancel Edit</button>
            </div>
        </form>
    </div>

    <!-- READ / LIST SECTION -->
    <div id="diary-list">
        <!-- Entries will be dynamically injected here -->
    </div>

    <script src="script.js"></script>
</body>
</html>
